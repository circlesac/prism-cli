name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -mod=vendor -race ./...
      - run: go vet -mod=vendor ./...

      - name: Verify generated files
        run: |
          test -z "$(gofmt -l .)"
          git diff --exit-code
